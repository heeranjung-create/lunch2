<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지? 🍽️</title>
  <style>
    :root {
      --cream: #fff8e7;
      --cream-dark: #fbeccb;
      --orange: #ff8a3d;
      --orange-dark: #e8701f;
      --orange-light: #ffe3cc;
      --text: #4a3426;
      --text-light: #8a6e5a;
      --white: #ffffff;
      --shadow: 0 6px 18px rgba(232, 112, 31, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      overflow-x: hidden;
    }

    body {
      background: var(--cream);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      line-height: 1.5;
      padding: 24px 16px 40px;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    /* ===== 헤더 ===== */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.9rem;
      color: var(--orange-dark);
      word-break: keep-all;
    }

    header p {
      color: var(--text-light);
      margin-top: 4px;
      word-break: keep-all;
    }

    /* ===== 카드 공통 ===== */
    .card {
      background: var(--white);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    /* ===== 선택 조건 ===== */
    .option-group {
      border: none;
      margin-bottom: 18px;
    }

    .option-group:last-child {
      margin-bottom: 0;
    }

    .option-group legend {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 10px;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option-btn {
      min-height: 44px;
      padding: 8px 16px;
      border: 2px solid var(--cream-dark);
      border-radius: 999px;
      background: var(--cream);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .option-btn:hover {
      border-color: var(--orange);
    }

    .option-btn:active {
      transform: scale(0.96);
    }

    /* 현재 선택된 항목 */
    .option-btn.selected {
      background: var(--orange);
      border-color: var(--orange);
      color: var(--white);
      font-weight: 700;
    }

    .option-btn.selected::before {
      content: "✔ ";
    }

    .option-btn:focus-visible,
    .action-btn:focus-visible {
      outline: 3px solid var(--orange-dark);
      outline-offset: 2px;
    }

    /* ===== 동작 버튼 ===== */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .actions-row {
      display: flex;
      gap: 10px;
    }

    .actions-row .action-btn {
      flex: 1;
    }

    .action-btn {
      min-height: 52px;
      padding: 12px 16px;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--orange);
      color: var(--white);
      font-size: 1.1rem;
      box-shadow: var(--shadow);
    }

    .btn-primary:hover {
      background: var(--orange-dark);
    }

    .btn-secondary {
      background: var(--orange-light);
      color: var(--orange-dark);
    }

    .btn-secondary:hover {
      background: #ffd3b0;
    }

    .btn-secondary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-ghost {
      background: var(--white);
      color: var(--text-light);
      border: 2px solid var(--cream-dark);
    }

    .btn-ghost:hover {
      border-color: var(--orange);
      color: var(--orange-dark);
    }

    /* ===== 결과 영역 ===== */
    .result {
      text-align: center;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .result .message {
      color: var(--text-light);
      font-size: 1rem;
      word-break: keep-all;
    }

    .result .message .big {
      display: block;
      font-size: 2.6rem;
      margin-bottom: 8px;
    }

    .result.pop {
      animation: pop 0.35s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.94); opacity: 0.4; }
      100% { transform: scale(1); opacity: 1; }
    }

    .menu-emoji {
      font-size: 4.5rem;
      line-height: 1.2;
    }

    .menu-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--orange-dark);
      margin-top: 6px;
      word-break: keep-all;
    }

    .menu-category {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 12px;
      border-radius: 999px;
      background: var(--cream);
      color: var(--text-light);
      font-size: 0.85rem;
    }

    .menu-desc {
      margin-top: 10px;
      word-break: keep-all;
    }

    .menu-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }

    .badge {
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--orange-light);
      color: var(--orange-dark);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .notice {
      margin-top: 14px;
      padding: 8px 14px;
      border-radius: 14px;
      background: #fff3d6;
      color: #9a6a00;
      font-size: 0.95rem;
      font-weight: 600;
      word-break: keep-all;
    }

    .price-note {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-light);
      word-break: keep-all;
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 8px;
    }

    @media (max-width: 400px) {
      header h1 { font-size: 1.6rem; }
      .card { padding: 16px; border-radius: 20px; }
      .option-btn { padding: 8px 13px; font-size: 0.9rem; }
      .actions-row { flex-direction: column; }
    }
  </style>
</head>

  <div class="container">

      <h1>오늘 뭐 먹지? 🍽️</h1>

    const SPICY_LABELS = ["😊 안 매움", "🌶️ 살짝 매움", "🌶️🌶️ 매움"];

    let selected = { ...DEFAULTS };
    let lastMenu = null; // 직전에 추천한 메뉴

    const resultEl = document.getElementById("result");
    const againBtn = document.getElementById("againBtn");

    // 선택 조건 버튼 만들기
    function renderOptions() {
      Object.keys(OPTIONS).forEach((group) => {
        const box = document.querySelector(`.options[data-group="${group}"]`);
        box.innerHTML = "";
        OPTIONS[group].forEach((opt) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn";
          btn.textContent = opt.label;
          btn.dataset.value = opt.value;
          btn.addEventListener("click", () => selectOption(group, opt.value));
          box.appendChild(btn);
        });
      });
      updateSelectedStyles();
    }

    // 현재 선택된 버튼 강조 표시
    function updateSelectedStyles() {
      document.querySelectorAll(".options").forEach((box) => {
        const group = box.dataset.group;
        box.querySelectorAll(".option-btn").forEach((btn) => {
          const isOn = btn.dataset.value === selected[group];
          btn.classList.toggle("selected", isOn);
          btn.setAttribute("aria-pressed", isOn ? "true" : "false");
        });
      });
    }

    // 조건 선택 → 이전 결과 대신 안내 문구 표시
    function selectOption(group, value) {
      if (selected[group] === value) return;
      selected[group] = value;
      updateSelectedStyles();
      lastMenu = null;
      againBtn.disabled = true;
      showMessage("🔁", "조건이 바뀌었어요. 다시 추천받아 보세요.");
    }

    // 선택한 조건을 모두 만족하는 메뉴 찾기
    function getMatchingMenus() {
      return MENUS.filter((menu) => {
        const okCategory = selected.category === "전체" || menu.category === selected.category;
        const okBudget = selected.budget === "none" || menu.price <= Number(selected.budget);
        const okSpicy = selected.spicy === "any" || menu.spicy === Number(selected.spicy);
        return okCategory && okBudget && okSpicy;
      });
    }

    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // 추천하기 (excludeLast가 true면 직전 메뉴 제외)
    function recommend(excludeLast) {
      const matches = getMatchingMenus();

      if (matches.length === 0) {
        lastMenu = null;
        againBtn.disabled = true;
        showMessage("😢", "조건에 맞는 메뉴가 없어요. 예산이나 다른 조건을 바꿔보세요.");
        return;
      }

      if (matches.length === 1) {
        lastMenu = matches[0];
        againBtn.disabled = false;
        showMenu(lastMenu, "조건에 맞는 메뉴가 하나예요.");
        return;
      }

      let candidates = matches;
      if (excludeLast && lastMenu) {
        candidates = matches.filter((menu) => menu !== lastMenu);
      }
      lastMenu = pickRandom(candidates);
      againBtn.disabled = false;
      showMenu(lastMenu, "");
    }

    function formatPrice(price) {
      return price.toLocaleString("ko-KR") + "원";
    }

    // 결과 카드 그리기
    function showMenu(menu, noticeText) {
      resultEl.innerHTML = "";

      const emoji = document.createElement("div");
      emoji.className = "menu-emoji";
      emoji.textContent = menu.emoji;

      const name = document.createElement("div");
      name.className = "menu-name";
      name.textContent = menu.name;

      const category = document.createElement("span");
      category.className = "menu-category";
      category.textContent = menu.category;

      const desc = document.createElement("p");
      desc.className = "menu-desc";
      desc.textContent = menu.desc;

      const info = document.createElement("div");
      info.className = "menu-info";
      const priceBadge = document.createElement("span");
      priceBadge.className = "badge";
      priceBadge.textContent = "💰 약 " + formatPrice(menu.price);
      const spicyBadge = document.createElement("span");
      spicyBadge.className = "badge";
      spicyBadge.textContent = SPICY_LABELS[menu.spicy];
      info.append(priceBadge, spicyBadge);

      resultEl.append(emoji, name, category, desc, info);

      if (noticeText) {
        const notice = document.createElement("p");
        notice.className = "notice";
        notice.textContent = "💡 " + noticeText;
        resultEl.appendChild(notice);
      }

      const note = document.createElement("p");
      note.className = "price-note";
      note.textContent = "※ 가격은 실습용 예시 금액이며 실제 식당 가격과 다를 수 있어요.";
      resultEl.appendChild(note);

      playPop();
    }

    // 안내 문구 표시
    function showMessage(icon, text) {
      resultEl.innerHTML = "";
      const msg = document.createElement("p");
      msg.className = "message";
      const big = document.createElement("span");
      big.className = "big";
      big.textContent = icon;
      msg.append(big, document.createTextNode(text));
      resultEl.appendChild(msg);
      playPop();
    }

    function playPop() {
      resultEl.classList.remove("pop");
      void resultEl.offsetWidth; // 애니메이션 다시 시작
      resultEl.classList.add("pop");
    }

    // 조건 초기화
    function resetOptions() {
      selected = { ...DEFAULTS };
      updateSelectedStyles();
      lastMenu = null;
      againBtn.disabled = true;
      showMessage("🍽️", "조건을 고르고 ‘점심 메뉴 추천받기’를 눌러 보세요!");
    }

    document.getElementById("recommendBtn").addEventListener("click", () => recommend(false));
    againBtn.addEventListener("click", () => recommend(true));
    document.getElementById("resetBtn").addEventListener("click", resetOptions);

    renderOptions();
    showMessage("🍽️", "조건을 고르고 ‘점심 메뉴 추천받기’를 눌러 보세요!");
  </script>
</body>
</html>
